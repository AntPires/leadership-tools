<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leadership Tools — PDI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --charcoal: #141414;
      --light: #E6E6E6;
      --bg: #F6F6F4;
      --white: #FFFFFF;
      --muted: #888;
      --border: #EBEBEB;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--charcoal);
      overflow: hidden;
    }

    /* ── APP SHELL ──────────────────────────── */
    .app { display: flex; height: 100vh; }

    /* ── SIDEBAR ─────────────────────────────── */
    .sidebar {
      width: 60px;
      flex-shrink: 0;
      background: var(--charcoal);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 0 24px;
    }

    .sidebar-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      padding-bottom: 16px;
      margin-bottom: 8px;
      width: 100%;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .sidebar-nav {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 8px 0;
    }

    .nav-item {
      position: relative;
      width: 40px;
      height: 40px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.35);
      cursor: default;
      user-select: none;
      text-decoration: none;
      transition: background 0.12s, color 0.12s;
    }

    .nav-item.active {
      background: rgba(255,255,255,0.1);
      color: #fff;
    }

    .nav-item:not(.active):hover {
      background: rgba(255,255,255,0.06);
      color: rgba(255,255,255,0.7);
    }

    .nav-icon { width: 16px; height: 16px; flex-shrink: 0; }

    .nav-item::after {
      content: attr(data-tooltip);
      position: absolute;
      left: calc(100% + 10px);
      top: 50%;
      transform: translateY(-50%);
      background: rgba(20,20,20,0.92);
      color: #fff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 11.5px;
      font-weight: 600;
      padding: 5px 9px;
      border-radius: 6px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s;
      z-index: 100;
    }

    .nav-item:hover::after { opacity: 1; }

    /* ── MAIN ────────────────────────────────── */
    .main { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }

    /* ── HEADER ──────────────────────────────── */
    .header {
      background: var(--white);
      border-bottom: 1px solid var(--border);
      padding: 0 28px;
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .header-left { display: flex; align-items: baseline; gap: 12px; }
    .header h1 { font-size: 16px; font-weight: 700; letter-spacing: -0.02em; }
    .header-sub { font-size: 12px; color: #bbb; }

    .header-right { display: flex; align-items: center; gap: 8px; }
    .header-right label { font-size: 12px; color: var(--muted); white-space: nowrap; }

    .liderado-input {
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      color: var(--charcoal);
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 7px;
      padding: 5px 11px;
      width: 190px;
      outline: none;
      transition: border-color 0.15s;
    }

    .liderado-input:focus { border-color: var(--charcoal); }
    .liderado-input::placeholder { color: #ccc; font-weight: 400; }

    .reset-btn {
      font-family: inherit;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--muted);
      background: none;
      border: 1.5px solid var(--border);
      border-radius: 7px;
      padding: 5px 12px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }

    .reset-btn:hover { border-color: #aaa; color: var(--charcoal); }

    /* ── CONTENT ─────────────────────────────── */
    .content { flex: 1; display: flex; min-height: 0; overflow: hidden; }

    /* ── LEFT COLUMN — Perfil atual ──────────── */
    .pdi-left {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 24px 28px;
      background: var(--white);
      border-right: 1px solid var(--border);
      overflow: hidden;
    }

    .perfil-label {
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .perfil-textarea {
      flex: 1;
      font-family: inherit;
      font-size: 13px;
      line-height: 1.8;
      color: var(--charcoal);
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      resize: none;
      outline: none;
      transition: border-color 0.15s;
      min-height: 200px;
    }

    .perfil-textarea:focus { border-color: var(--charcoal); }
    .perfil-textarea::placeholder { color: #ccc; }

    /* ── RIGHT COLUMN ────────────────────────── */
    .pdi-right {
      flex: 1;
      overflow-y: auto;
      background: var(--bg);
      padding: 20px 24px 40px;
      display: flex;
      flex-direction: column;
    }

    .focos-section-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 14px;
      flex-shrink: 0;
    }

    .focos-section-title {
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .focos-counter {
      font-size: 10px;
      font-weight: 600;
      color: #ccc;
      letter-spacing: 0.04em;
    }

    /* ── FOCO CARDS ──────────────────────────── */
    .focos-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .foco-card {
      background: var(--white);
      border: 1.5px solid var(--border);
      border-radius: 11px;
      padding: 16px 18px 14px;
    }

    .foco-row {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    /* ── AÇÕES ───────────────────────────────── */
    .acoes-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 10px;
      margin-left: 20px;
    }

    .acao-item { display: flex; flex-direction: column; }

    .acao-row {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    /* ── PAPEIS ──────────────────────────────── */
    .papel-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 5px;
      margin-left: 23px;
    }

    .papel-item {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    /* ── BULLETS ─────────────────────────────── */
    .list-bullet {
      font-size: 11px;
      color: var(--charcoal);
      flex-shrink: 0;
      width: 16px;
      text-align: center;
      user-select: none;
    }

    .list-bullet.muted { color: #bbb; }

    /* ── INPUTS ──────────────────────────────── */
    .list-input {
      flex: 1;
      font-family: inherit;
      font-size: 12.5px;
      color: var(--charcoal);
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 7px;
      padding: 6px 10px;
      outline: none;
      transition: border-color 0.15s;
    }

    .list-input:focus { border-color: var(--charcoal); background: var(--white); }
    .list-input::placeholder { color: #ccc; }

    /* ── REMOVE BTN ──────────────────────────── */
    .remove-btn {
      font-size: 15px;
      line-height: 1;
      color: #d0d0d0;
      background: none;
      border: none;
      cursor: pointer;
      padding: 2px 5px;
      transition: color 0.12s;
      flex-shrink: 0;
    }

    .remove-btn:hover { color: var(--charcoal); }

    /* ── ADD BUTTONS ─────────────────────────── */
    .add-btn {
      font-family: inherit;
      font-weight: 600;
      color: #aaa;
      background: none;
      border: 1.5px dashed #ddd;
      border-radius: 7px;
      cursor: pointer;
      transition: border-color 0.14s, color 0.14s;
      text-align: left;
    }

    .add-btn:hover { border-color: #aaa; color: var(--charcoal); }
    .add-btn:disabled { opacity: 0.35; cursor: default; pointer-events: none; }

    .add-foco-btn {
      font-size: 11.5px;
      padding: 7px 14px;
      margin-top: 12px;
      width: 100%;
    }

    .add-acao-btn {
      font-size: 11px;
      padding: 5px 10px;
      margin-top: 8px;
      width: 100%;
    }

    .add-papel-btn {
      font-size: 10.5px;
      padding: 4px 9px;
      margin-top: 5px;
      margin-left: 23px;
      width: calc(100% - 23px);
    }
  </style>
</head>
<body>
<div class="app">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <img src="../assets/logo-bcotransp.svg" alt="Wave" width="28" height="28">
    </div>
    <nav class="sidebar-nav">
      <a class="nav-item" href="../ladder/index.html" data-tooltip="Ladder">
        <svg class="nav-icon" viewBox="0 0 16 16" fill="none">
          <path d="M2 14 L2 10 L6 10 L6 6 L10 6 L10 2 L14 2"
            stroke="currentColor" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
      <a class="nav-item active" href="#" data-tooltip="PDI">
        <svg class="nav-icon" viewBox="0 0 16 16" fill="none">
          <path d="M8 2L9.6 5.4 13.4 6 10.7 8.6 11.4 12.4 8 10.7 4.6 12.4 5.3 8.6 2.6 6 6.4 5.4Z"
            stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
        </svg>
      </a>
      <div class="nav-item" data-tooltip="Moving Motivators">
        <svg class="nav-icon" viewBox="0 0 16 16" fill="none">
          <circle cx="8" cy="8" r="5.5" stroke="currentColor" stroke-width="1.4"/>
          <circle cx="6.2" cy="7.2" r="0.7" fill="currentColor"/>
          <circle cx="9.8" cy="7.2" r="0.7" fill="currentColor"/>
          <path d="M5.5 10 Q8 12 10.5 10" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
        </svg>
      </div>
    </nav>
  </aside>

  <!-- Main -->
  <div class="main">

    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <h1>PDI</h1>
        <span class="header-sub">Plano de Desenvolvimento Individual</span>
      </div>
      <div class="header-right">
        <label for="liderado-name">Liderado</label>
        <input class="liderado-input" id="liderado-name" type="text" placeholder="Nome do liderado" autocomplete="off" />
        <button class="reset-btn" onclick="resetPDI()">Reiniciar</button>
      </div>
    </header>

    <!-- Content -->
    <div class="content">

      <!-- Left: Perfil atual -->
      <div class="pdi-left">
        <div class="perfil-label">Perfil atual</div>
        <textarea
          class="perfil-textarea"
          id="perfil-textarea"
          placeholder="Síntese da pessoa: impacto atual, pontos fortes e desafios identificados no D1. Considere Ladder, motivadores e contexto do momento…"
        ></textarea>
      </div>

      <!-- Right: Focos hierárquicos -->
      <div class="pdi-right">
        <div class="focos-section-header">
          <span class="focos-section-title">Focos do ciclo</span>
          <span class="focos-counter" id="focos-counter">1 / 3</span>
        </div>
        <div id="focos-container" class="focos-container"></div>
        <button class="add-btn add-foco-btn" id="add-foco-btn" onclick="addFoco()">+ Adicionar foco</button>
      </div>

    </div>
  </div>
</div>

<script>
const MAX_FOCOS = 3;
const MAX_ACOES = 3;
const MAX_PAPEL = 3;

// ── Papel do líder ────────────────────────────────────────

function addPapel(acaoItem) {
  const list = acaoItem.querySelector('.papel-list');
  if (list.children.length >= MAX_PAPEL) return;
  const item = document.createElement('div');
  item.className = 'papel-item';
  item.innerHTML = `
    <span class="list-bullet">○</span>
    <input type="text" class="list-input" placeholder="Descreva o compromisso…" />
    <button class="remove-btn" onclick="removePapel(this)" title="Remover">×</button>
  `;
  list.appendChild(item);
  item.querySelector('input').focus();
  updateAddPapelBtn(acaoItem);
}

function removePapel(btn) {
  const item = btn.closest('.papel-item');
  const list = item.parentElement;
  const acaoItem = list.closest('.acao-item');
  if (list.children.length > 1) {
    item.remove();
  } else {
    item.querySelector('input').value = '';
  }
  updateAddPapelBtn(acaoItem);
}

function updateAddPapelBtn(acaoItem) {
  const count = acaoItem.querySelector('.papel-list').children.length;
  acaoItem.querySelector('.add-papel-btn').disabled = count >= MAX_PAPEL;
}

// ── Ações internas ────────────────────────────────────────

function createAcaoItem() {
  const item = document.createElement('div');
  item.className = 'acao-item';
  item.innerHTML = `
    <div class="acao-row">
      <span class="list-bullet muted">→</span>
      <input type="text" class="list-input acao-input" placeholder="Descreva a ação…" />
      <button class="remove-btn" onclick="removeAcao(this)" title="Remover">×</button>
    </div>
    <div class="papel-list"></div>
    <button class="add-btn add-papel-btn" onclick="addPapel(this.closest('.acao-item'))">+ Papel do líder</button>
  `;
  addPapel(item);
  return item;
}

function addAcao(focoCard) {
  const list = focoCard.querySelector('.acoes-list');
  if (list.children.length >= MAX_ACOES) return;
  const item = createAcaoItem();
  list.appendChild(item);
  item.querySelector('.acao-input').focus();
  updateAddAcaoBtn(focoCard);
}

function removeAcao(btn) {
  const acaoItem = btn.closest('.acao-item');
  const list = acaoItem.parentElement;
  const focoCard = list.closest('.foco-card');
  if (list.children.length > 1) {
    acaoItem.remove();
  } else {
    acaoItem.querySelector('.acao-input').value = '';
    acaoItem.querySelector('.papel-list').innerHTML = '';
    addPapel(acaoItem);
  }
  updateAddAcaoBtn(focoCard);
}

function updateAddAcaoBtn(focoCard) {
  const count = focoCard.querySelector('.acoes-list').children.length;
  focoCard.querySelector('.add-acao-btn').disabled = count >= MAX_ACOES;
}

// ── Focos do ciclo ────────────────────────────────────────

function createFocoCard() {
  const card = document.createElement('div');
  card.className = 'foco-card';
  card.innerHTML = `
    <div class="foco-row">
      <span class="list-bullet">◆</span>
      <input type="text" class="list-input foco-input" placeholder="Descreva o foco do ciclo…" />
      <button class="remove-btn" onclick="removeFoco(this)" title="Remover">×</button>
    </div>
    <div class="acoes-list"></div>
    <button class="add-btn add-acao-btn" onclick="addAcao(this.closest('.foco-card'))">+ Adicionar ação</button>
  `;
  card.querySelector('.acoes-list').appendChild(createAcaoItem());
  return card;
}

function addFoco() {
  const container = document.getElementById('focos-container');
  if (container.children.length >= MAX_FOCOS) return;
  const card = createFocoCard();
  container.appendChild(card);
  card.querySelector('.foco-input').focus();
  updateFocosCounter();
}

function removeFoco(btn) {
  const card = btn.closest('.foco-card');
  const container = card.parentElement;
  if (container.children.length > 1) {
    card.remove();
  } else {
    card.querySelector('.foco-input').value = '';
    card.querySelector('.acoes-list').innerHTML = '';
    card.querySelector('.acoes-list').appendChild(createAcaoItem());
    card.querySelector('.add-acao-btn').disabled = false;
  }
  updateFocosCounter();
}

function updateFocosCounter() {
  const count = document.getElementById('focos-container').children.length;
  document.getElementById('focos-counter').textContent = `${count} / ${MAX_FOCOS}`;
  document.getElementById('add-foco-btn').disabled = count >= MAX_FOCOS;
}

// ── Reset & Init ──────────────────────────────────────────

function resetPDI() {
  document.getElementById('liderado-name').value = '';
  document.getElementById('perfil-textarea').value = '';
  document.getElementById('focos-container').innerHTML = '';
  init();
}

function init() {
  document.getElementById('focos-container').appendChild(createFocoCard());
  updateFocosCounter();
  document.querySelectorAll('input, textarea').forEach(i => i.blur());
}

init();
</script>
</body>
</html>
