<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leadership Tools — PDI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/shared.css">
  <style>

    /* ── BODY (coluna única scrollável) ─────── */
    .pdi-body {
      flex: 1;
      overflow-y: auto;
      background: var(--bg);
    }

    .pdi-column {
      max-width: 720px;
      margin: 0 auto;
      padding: 40px 28px 80px;
      display: flex;
      flex-direction: column;
      gap: 44px;
    }

    /* ── PERFIL ATUAL ────────────────────────── */
    .perfil-textarea {
      display: block;
      width: 100%;
      height: 130px;
      font-family: inherit;
      font-size: 13px;
      line-height: 1.8;
      color: var(--charcoal);
      background: var(--white);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      resize: vertical;
      outline: none;
      transition: border-color 0.15s;
    }

    .perfil-textarea:focus { border-color: var(--charcoal); }
    .perfil-textarea::placeholder { color: #ccc; }

    /* ── FOCOS SECTION ───────────────────────── */
    .focos-section-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .focos-section-header .section-label { margin-bottom: 0; }

    .focos-counter {
      font-size: 10px;
      font-weight: 600;
      color: #ccc;
      letter-spacing: 0.04em;
    }

    /* ── FOCO CARDS ──────────────────────────── */
    .focos-container {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .foco-card {
      background: var(--white);
      border: 1.5px solid var(--border);
      border-radius: 11px;
      padding: 18px 20px 16px;
    }

    .foco-row {
      display: flex;
      align-items: flex-start;
      gap: 7px;
    }

    /* ── AÇÕES — borda lateral de hierarquia ─── */
    .acoes-list {
      margin-top: 14px;
      margin-left: 10px;
      padding-left: 14px;
      border-left: 1.5px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .acao-item { display: flex; flex-direction: column; }

    .acao-row {
      display: flex;
      align-items: flex-start;
      gap: 7px;
    }

    /* ── PAPEIS — borda lateral de hierarquia ── */
    .papel-list {
      margin-top: 6px;
      margin-left: 8px;
      padding-left: 12px;
      border-left: 1.5px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .papel-item {
      display: flex;
      align-items: flex-start;
      gap: 7px;
    }

    /* ── BULLETS ─────────────────────────────── */
    .list-bullet {
      font-size: 11px;
      color: var(--charcoal);
      flex-shrink: 0;
      width: 16px;
      text-align: center;
      user-select: none;
      padding-top: 9px; /* alinha com a primeira linha do textarea */
    }

    .list-bullet.muted { color: #bbb; }
    .list-bullet.soft  { color: var(--muted); }

    /* ── INPUTS (textarea auto-grow) ────────── */
    .list-input {
      flex: 1;
      font-family: inherit;
      font-size: 13px;
      line-height: 1.65;
      color: var(--charcoal);
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 7px;
      padding: 8px 12px;
      outline: none;
      transition: border-color 0.15s;
      resize: none;
      overflow: hidden;
      min-height: 38px;
    }

    .list-input:focus { border-color: var(--charcoal); background: var(--white); }
    .list-input::placeholder { color: #ccc; }

    /* ── REMOVE BTN ──────────────────────────── */
    .remove-btn {
      font-size: 15px;
      line-height: 1;
      color: #d0d0d0;
      background: none;
      border: none;
      cursor: pointer;
      padding: 2px 5px;
      transition: color 0.12s;
      flex-shrink: 0;
      margin-top: 6px; /* alinha com a primeira linha do textarea */
    }

    .remove-btn:hover { color: var(--charcoal); }

    /* ── ADD BUTTONS ─────────────────────────── */
    .add-btn {
      font-family: inherit;
      font-weight: 600;
      color: #aaa;
      background: none;
      border: 1.5px dashed #ddd;
      border-radius: 7px;
      cursor: pointer;
      transition: border-color 0.14s, color 0.14s;
      display: inline-flex;
      align-items: center;
      white-space: nowrap;
      align-self: flex-start; /* não estica em containers flex column */
    }

    .add-btn:hover { border-color: #aaa; color: var(--charcoal); }
    .add-btn:disabled { opacity: 0.35; cursor: default; pointer-events: none; }

    /* ── PILAR SELECT (categoria do foco) ────── */
    .pilar-select {
      font-family: inherit;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 5px 28px 5px 13px;
      border-radius: 20px;
      border: 1.5px dashed #ddd;
      background-color: transparent;
      color: #bbb;
      cursor: pointer;
      outline: none;
      appearance: none;
      -webkit-appearance: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10' fill='none'><path d='M2 4 L5 7 L8 4' stroke='%23bbb' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/></svg>");
      background-repeat: no-repeat;
      background-position: right 10px center;
      background-size: 10px;
      margin-bottom: 12px;
      transition: border-color 0.14s, color 0.14s, background-color 0.14s;
      line-height: 1.5;
    }

    .pilar-select:hover { border-color: #aaa; color: var(--charcoal); }

    .pilar-select.filled {
      border: 1.5px solid var(--charcoal);
      background-color: var(--charcoal);
      color: var(--white);
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10' fill='none'><path d='M2 4 L5 7 L8 4' stroke='%23ffffff' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    }

    .pilar-select.filled:hover { border-color: var(--charcoal); }

    .pilar-select option { color: var(--charcoal); background: var(--white); }

    .add-foco-btn {
      font-size: 11.5px;
      padding: 7px 14px;
      margin-top: 14px;
    }

    .add-acao-btn {
      font-size: 11px;
      padding: 5px 11px;
      margin-top: 10px;
    }

    .add-papel-btn {
      font-size: 10.5px;
      padding: 4px 10px;
      margin-top: 6px;
      margin-left: 20px; /* alinha com os itens de papel (8px + 12px) */
    }

    /* ── PDI ACTIONS (fim da página) ─────────── */
    .pdi-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 40px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>
<div class="app">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <img src="../assets/logo-bcotransp.svg" alt="Wave" width="28" height="28">
    </div>
    <nav class="sidebar-nav">
      <a class="nav-item" href="../ladder/index.html" data-tooltip="Ladder">
        <svg class="nav-icon" viewBox="0 0 16 16" fill="none">
          <path d="M2 14 L2 10 L6 10 L6 6 L10 6 L10 2 L14 2"
            stroke="currentColor" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
      <a class="nav-item active" href="#" data-tooltip="PDI">
        <svg class="nav-icon" viewBox="0 0 16 16" fill="none">
          <path d="M8 2L9.6 5.4 13.4 6 10.7 8.6 11.4 12.4 8 10.7 4.6 12.4 5.3 8.6 2.6 6 6.4 5.4Z"
            stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
        </svg>
      </a>
      <div class="nav-item" data-tooltip="Moving Motivators">
        <svg class="nav-icon" viewBox="0 0 16 16" fill="none">
          <circle cx="8" cy="8" r="5.5" stroke="currentColor" stroke-width="1.4"/>
          <circle cx="6.2" cy="7.2" r="0.7" fill="currentColor"/>
          <circle cx="9.8" cy="7.2" r="0.7" fill="currentColor"/>
          <path d="M5.5 10 Q8 12 10.5 10" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
        </svg>
      </div>
    </nav>
  </aside>

  <!-- Main -->
  <div class="main">

    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <h1>PDI</h1>
        <span class="header-sub">Plano de Desenvolvimento Individual</span>
      </div>
      <div class="header-right">
        <div class="header-field">
          <label for="designer-name">Designer</label>
          <input class="input designer-input" id="designer-name" type="text" placeholder="Nome do designer" autocomplete="off" />
        </div>
      </div>
    </header>

    <!-- Body: coluna única centralizada -->
    <div class="pdi-body">
      <div class="pdi-column">

        <!-- Perfil atual -->
        <div class="perfil-section">
          <span class="section-label">Perfil atual</span>
          <textarea
            class="perfil-textarea"
            id="perfil-textarea"
            placeholder="Síntese do momento atual: impacto percebido, pontos fortes e principais desafios. Use o D1 e a Ladder como referência…"
          ></textarea>
        </div>

        <!-- Focos do ciclo -->
        <div class="focos-section">
          <div class="focos-section-header">
            <span class="section-label">Focos do ciclo</span>
            <span class="focos-counter" id="focos-counter">1 / 3</span>
          </div>
          <div id="focos-container" class="focos-container"></div>
          <button class="add-btn add-foco-btn" id="add-foco-btn" onclick="addFoco()">+ Adicionar foco</button>
        </div>

        <!-- Ações principais -->
        <div class="pdi-actions">
          <button class="btn btn-secondary" onclick="resetPDI()">Reiniciar</button>
          <button class="btn btn-primary" id="export-btn" onclick="exportPDI()">Exportar PDI</button>
        </div>

      </div>
    </div>

  </div>
</div>

<script>
const MAX_FOCOS = 3;
const MAX_ACOES = 3;
const MAX_PAPEL = 3;

function autoGrow(el) {
  el.style.height = 'auto';
  el.style.height = el.scrollHeight + 'px';
}

function onPilarChange(sel) {
  sel.classList.toggle('filled', !!sel.value);
}

// ── Papel do líder ────────────────────────────────────────

function addPapel(acaoItem) {
  const list = acaoItem.querySelector('.papel-list');
  if (list.children.length >= MAX_PAPEL) return;
  const item = document.createElement('div');
  item.className = 'papel-item';
  item.innerHTML = `
    <span class="list-bullet soft">○</span>
    <textarea class="list-input" placeholder="Descreva o compromisso do líder" rows="1" oninput="autoGrow(this)"></textarea>
    <button class="remove-btn" onclick="removePapel(this)" title="Remover">×</button>
  `;
  list.appendChild(item);
  item.querySelector('textarea').focus();
  updateAddPapelBtn(acaoItem);
}

function removePapel(btn) {
  const item = btn.closest('.papel-item');
  const list = item.parentElement;
  const acaoItem = list.closest('.acao-item');
  if (list.children.length > 1) {
    item.remove();
  } else {
    item.querySelector('textarea').value = '';
  }
  updateAddPapelBtn(acaoItem);
}

function updateAddPapelBtn(acaoItem) {
  const count = acaoItem.querySelector('.papel-list').children.length;
  acaoItem.querySelector('.add-papel-btn').disabled = count >= MAX_PAPEL;
}

// ── Ações internas ────────────────────────────────────────

function createAcaoItem() {
  const item = document.createElement('div');
  item.className = 'acao-item';
  item.innerHTML = `
    <div class="acao-row">
      <span class="list-bullet muted">→</span>
      <textarea class="list-input acao-input" placeholder="Descreva a ação interna" rows="1" oninput="autoGrow(this)"></textarea>
      <button class="remove-btn" onclick="removeAcao(this)" title="Remover">×</button>
    </div>
    <div class="papel-list"></div>
    <button class="add-btn add-papel-btn" onclick="addPapel(this.closest('.acao-item'))">+ Papel do líder</button>
  `;
  addPapel(item);
  return item;
}

function addAcao(focoCard) {
  const list = focoCard.querySelector('.acoes-list');
  if (list.children.length >= MAX_ACOES) return;
  const item = createAcaoItem();
  list.appendChild(item);
  item.querySelector('.acao-input').focus();
  updateAddAcaoBtn(focoCard);
}

function removeAcao(btn) {
  const acaoItem = btn.closest('.acao-item');
  const list = acaoItem.parentElement;
  const focoCard = list.closest('.foco-card');
  if (list.children.length > 1) {
    acaoItem.remove();
  } else {
    acaoItem.querySelector('.acao-input').value = '';
    acaoItem.querySelector('.papel-list').innerHTML = '';
    addPapel(acaoItem);
  }
  updateAddAcaoBtn(focoCard);
}

function updateAddAcaoBtn(focoCard) {
  const count = focoCard.querySelector('.acoes-list').children.length;
  focoCard.querySelector('.add-acao-btn').disabled = count >= MAX_ACOES;
}

// ── Focos do ciclo ────────────────────────────────────────

function createFocoCard() {
  const card = document.createElement('div');
  card.className = 'foco-card';
  card.innerHTML = `
    <select class="pilar-select" onchange="onPilarChange(this)">
      <option value="">Selecione um pilar</option>
      <option>Experiência</option>
      <option>Sistemas</option>
      <option>Estratégia</option>
      <option>Influência</option>
      <option>Descoberta</option>
    </select>
    <div class="foco-row">
      <span class="list-bullet">◆</span>
      <textarea class="list-input foco-input" placeholder="Descreva o foco do ciclo" rows="1" oninput="autoGrow(this)"></textarea>
      <button class="remove-btn" onclick="removeFoco(this)" title="Remover">×</button>
    </div>
    <div class="acoes-list"></div>
    <button class="add-btn add-acao-btn" onclick="addAcao(this.closest('.foco-card'))">+ Adicionar ação</button>
  `;
  card.querySelector('.acoes-list').appendChild(createAcaoItem());
  return card;
}

function addFoco() {
  const container = document.getElementById('focos-container');
  if (container.children.length >= MAX_FOCOS) return;
  const card = createFocoCard();
  container.appendChild(card);
  card.querySelector('.foco-input').focus();
  updateFocosCounter();
}

function removeFoco(btn) {
  const card = btn.closest('.foco-card');
  const container = card.parentElement;
  if (container.children.length > 1) {
    card.remove();
  } else {
    card.querySelector('.foco-input').value = '';
    card.querySelector('.acoes-list').innerHTML = '';
    card.querySelector('.acoes-list').appendChild(createAcaoItem());
    card.querySelector('.add-acao-btn').disabled = false;
  }
  updateFocosCounter();
}

function updateFocosCounter() {
  const count = document.getElementById('focos-container').children.length;
  document.getElementById('focos-counter').textContent = `${count} / ${MAX_FOCOS}`;
  document.getElementById('add-foco-btn').disabled = count >= MAX_FOCOS;
}

// ── Reset & Init ──────────────────────────────────────────

function resetPDI() {
  document.getElementById('designer-name').value = '';
  document.getElementById('perfil-textarea').value = '';
  document.getElementById('focos-container').innerHTML = '';
  init();
}

// ── Export ────────────────────────────────────────────────

function exportPDI() {
  const designer = document.getElementById('designer-name').value.trim();
  const dataStr  = new Date().toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
  const dataTitle = dataStr.charAt(0).toUpperCase() + dataStr.slice(1);
  const perfil   = document.getElementById('perfil-textarea').value.trim();

  const focos = [...document.querySelectorAll('.foco-card')].map(card => ({
    pilar: card.querySelector('.pilar-select').value,
    texto: card.querySelector('.foco-input').value.trim(),
    acoes: [...card.querySelectorAll('.acao-item')].map(a => ({
      texto: a.querySelector('.acao-input').value.trim(),
      papeis: [...a.querySelectorAll('.papel-item textarea')]
                .map(p => p.value.trim()).filter(Boolean)
    })).filter(a => a.texto || a.papeis.length)
  })).filter(f => f.texto || f.acoes.length);

  // Vazio?
  if (!designer && !perfil && focos.length === 0) {
    flashExportBtn('Vazio');
    return;
  }

  const lines = [];
  lines.push(`PDI${designer ? ' — ' + designer : ''}`);
  lines.push(dataTitle);
  lines.push('');

  if (perfil) {
    lines.push('PERFIL ATUAL');
    lines.push(perfil);
    lines.push('');
  }

  if (focos.length) {
    lines.push('FOCOS DO CICLO');
    lines.push('');
    focos.forEach((f, i) => {
      const head = `${i + 1}.${f.pilar ? ' [' + f.pilar + ']' : ''}${f.texto ? ' ' + f.texto : ''}`;
      lines.push(head);
      f.acoes.forEach(a => {
        if (a.texto) lines.push(`   → ${a.texto}`);
        a.papeis.forEach(p => lines.push(`     ○ ${p}`));
      });
      lines.push('');
    });
  }

  const text = lines.join('\n').trimEnd();
  navigator.clipboard.writeText(text).then(
    () => flashExportBtn('Copiado!'),
    () => flashExportBtn('Erro')
  );
}

function flashExportBtn(label) {
  const btn = document.getElementById('export-btn');
  const original = btn.textContent;
  btn.textContent = label;
  btn.classList.add('copied');
  clearTimeout(btn._t);
  btn._t = setTimeout(() => {
    btn.textContent = original;
    btn.classList.remove('copied');
  }, 1800);
}

function init() {
  document.getElementById('focos-container').appendChild(createFocoCard());
  updateFocosCounter();
  updateExportState();
  document.querySelectorAll('input, textarea').forEach(i => i.blur());
}

// ── Export state (habilita/desabilita botão) ──────────────

function updateExportState() {
  const designer = document.getElementById('designer-name').value.trim();
  const perfil   = document.getElementById('perfil-textarea').value.trim();
  const anyText  = [...document.querySelectorAll('.foco-input, .acao-input, .papel-item textarea')]
                     .some(el => el.value.trim());
  const anyPilar = [...document.querySelectorAll('.pilar-select')].some(s => !!s.value);
  document.getElementById('export-btn').disabled = !(designer || perfil || anyText || anyPilar);
}

// Listeners globais — captura digitação, seleção de pilar e mudanças DOM
document.addEventListener('input',  updateExportState);
document.addEventListener('change', updateExportState);
new MutationObserver(updateExportState).observe(
  document.getElementById('focos-container'),
  { childList: true, subtree: true }
);

init();
</script>
</body>
</html>
